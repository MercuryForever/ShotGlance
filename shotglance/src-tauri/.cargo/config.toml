# 发布构建前置：取消下面两行的注释，让 exe 静态链接 MSVC 运行库，
# 从而彻底摆脱目标机器上的 VCRUNTIME140.dll 依赖。
# 注意：开启后请用 `cargo build --release` 完整验证一次链接是否通过。
#
# [target.x86_64-pc-windows-msvc]
# rustflags = ["-C", "target-feature=+crt-static"]

[build]
# 编译产物统一落到仓库根的「构建区」build/target（含 release/bundle/nsis 安装包）。
# cargo 的路径基准是「.cargo 目录的父目录」，即 src-tauri/，所以这里要退两级。
# 原则：源码树里不出现任何编译输出，删掉整个 build/ 不影响可重建性。
target-dir = "../../build/target"

[net]
retry = 3
